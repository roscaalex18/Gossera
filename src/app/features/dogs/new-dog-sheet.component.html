<div class="sheet-backdrop" (click)="onBackdropClick()"></div>

<aside class="sheet" role="dialog" aria-modal="true" aria-label="Añadir nuevo perro">
  <header class="sheet__header">
    <div>
      <h2>Nuevo perro</h2>
      <p>Rellena los datos básicos. Podrás añadir fotos justo después.</p>
    </div>
    <button type="button" class="icon-btn" (click)="onCloseClick()" aria-label="Cerrar">×</button>
  </header>

  <form class="sheet__form" (ngSubmit)="submit()" novalidate>
    <div class="grid">
      <label class="field">
        <span>ID <em>*</em></span>
        <input
          type="text"
          name="id"
          required
          placeholder="R-160"
          autocomplete="off"
          [ngModel]="id()"
          (ngModelChange)="id.set($event)"
        />
      </label>

      <label class="field">
        <span>Nombre <em>*</em></span>
        <input
          type="text"
          name="nombre"
          required
          [ngModel]="nombre()"
          (ngModelChange)="nombre.set($event)"
        />
      </label>

      <label class="field">
        <span>Raza <em>*</em></span>
        <input
          type="text"
          name="raza"
          required
          [ngModel]="raza()"
          (ngModelChange)="raza.set($event)"
        />
      </label>

      <label class="field">
        <span>Edad</span>
        <input
          type="number"
          name="edad"
          min="0"
          max="30"
          inputmode="numeric"
          [ngModel]="edad()"
          (ngModelChange)="edad.set($event)"
        />
      </label>

      <label class="field">
        <span>Energía</span>
        <select
          name="energia"
          [ngModel]="energia()"
          (ngModelChange)="energia.set($event)"
        >
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </label>

      <label class="field">
        <span>Prioridad paseo</span>
        <select
          name="prioridadPaseo"
          [ngModel]="prioridadPaseo()"
          (ngModelChange)="prioridadPaseo.set($event)"
        >
          <option value="baja">Baja</option>
          <option value="media">Media</option>
          <option value="alta">Alta</option>
        </select>
      </label>

      <label class="field">
        <span>Sexo</span>
        <select
          name="sexo"
          [ngModel]="sexo()"
          (ngModelChange)="sexo.set($event)"
        >
          <option value="">-</option>
          <option value="male">Macho</option>
          <option value="female">Hembra</option>
        </select>
      </label>

      <label class="field">
        <span>Color</span>
        <input
          type="text"
          name="color"
          [ngModel]="color()"
          (ngModelChange)="color.set($event)"
        />
      </label>

      <fieldset class="field field--wide flags-fieldset">
        <legend>Avisos de seguridad</legend>
        <div class="flags-grid">
          <label class="flag-check">
            <input
              type="checkbox"
              name="esPPP"
              [ngModel]="esPPP()"
              (ngModelChange)="esPPP.set($event)"
            />
            <span>PPP <small>(Perro Potencialmente Peligroso)</small></span>
          </label>
          <label class="flag-check">
            <input
              type="checkbox"
              name="bozalObligatorio"
              [ngModel]="bozalObligatorio()"
              (ngModelChange)="bozalObligatorio.set($event)"
            />
            <span>Bozal obligatorio</span>
          </label>
          <label class="flag-check">
            <input
              type="checkbox"
              name="cuidadoMachos"
              [ngModel]="cuidadoMachos()"
              (ngModelChange)="cuidadoMachos.set($event)"
            />
            <span>Cuidado con machos</span>
          </label>
          <label class="flag-check">
            <input
              type="checkbox"
              name="cuidadoHembras"
              [ngModel]="cuidadoHembras()"
              (ngModelChange)="cuidadoHembras.set($event)"
            />
            <span>Cuidado con hembras</span>
          </label>
        </div>
      </fieldset>

      <label class="field field--wide">
        <span>Notas importantes</span>
        <textarea
          name="notas"
          rows="3"
          placeholder="Comportamiento, alergias, historia, recomendaciones…"
          [ngModel]="notas()"
          (ngModelChange)="notas.set($event)"
        ></textarea>
      </label>
    </div>

    @if (errorMessage()) {
      <p class="sheet__error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="sheet__actions">
      <button type="button" class="btn-secondary" (click)="onCloseClick()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="!canSubmit()">
        @if (saving()) { Creando… } @else { Crear perro }
      </button>
    </div>
  </form>
</aside>
